<style>

<body>
<div id="carregando" class="oculto">Processando...</div>

<script>
// =====================================================================
// CONFIGURAÇÃO: preencha com os dados do projeto Supabase da Irko
// (Project Settings > API). A chave "anon" é pública por definição;
// a proteção dos dados é feita pelo login e pelas regras RLS do banco.
// Se ficarem vazios, o sistema pede os dados na primeira abertura.
// =====================================================================
const SUPABASE_URL = "https://mqhgifzsafcrpifrgcjd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_y8ziziRLxyvhmxJyPMeBaA_p7_wJs6r";

const BUCKET = "perdcomp-pdfs";
const LOGO = "https://site.irko.com.br/wp-content/uploads/2023/02/Irko_marca-color-300x60.png";
const STATUS_DOC = ["Transmitido","Em análise","Homologado","Homologado parcialmente","Não homologado",
                    "Deferido","Indeferido","Retificado","Cancelado"];
const STATUS_EXCLUIDOS = new Set(["Retificado","Cancelado"]);
const TOL = 0.02;

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// ---------------------------------------------------------------------
// Utilitários
// ---------------------------------------------------------------------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = v => Math.round((Number(v) + Number.EPSILON) * 100) / 100;
const num = v => v == null || v === "" ? null : Number(v);
const brl = v => v == null || isNaN(v) ? "-" : Number(v).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const n2 = v => v == null || isNaN(v) ? "-" : Number(v).toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = v => v == null || isNaN(v) ? "-" : n2(v) + "%";
const dt = iso => iso ? String(iso).slice(0,10).split("-").reverse().join("/") : "";
const dataHora = ts => ts ? new Date(ts).toLocaleString("pt-BR", {dateStyle: "short", timeStyle: "short"}) : "";
const mesAno = ym => ym ? ym.slice(5) + "/" + ym.slice(0,4) : "-";
const hojeISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
function carregando(on){ $("#carregando").classList.toggle("oculto", !on); }

// =====================================================================
// LEITURA DO PDF DO PER/DCOMP
// =====================================================================
const PD = (() => {
  const NUM = String.raw`\d{5}\.\d{5}\.\d{6}\.\d\.\d\.\d{2}-\d{4}`;
  const MESES = {janeiro:1,fevereiro:2,"março":3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&");

  async function textoPaginas(buf) {
    const pdf = await pdfjsLib.getDocument({data: new Uint8Array(buf)}).promise;
    const paginas = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const linhas = [];
      for (const it of tc.items) {
        if (!it.str) continue;
        const y = it.transform[5], x = it.transform[4];
        let l = linhas.find(l => Math.abs(l.y - y) < 2.5);
        if (!l) { l = {y, itens: []}; linhas.push(l); }
        l.itens.push({x, w: it.width, s: it.str});
      }
      linhas.sort((a, b) => b.y - a.y);
      paginas.push(linhas.map(l => {
        l.itens.sort((a, b) => a.x - b.x);
        let out = "", fim = null;
        for (const it of l.itens) {
          if (fim !== null && it.x - fim > 0.8 && !out.endsWith(" ") && !it.s.startsWith(" ")) out += " ";
          out += it.s; fim = it.x + it.w;
        }
        return out.replace(/\s+/g, " ").trim();
      }).filter(Boolean).join("\n"));
    }
    return paginas;
  }

  const brNum = s => {
    if (s == null) return null;
    s = String(s).replace(/R\$|\s|%/g, "");
    if (!s) return null;
    const v = Number(s.replace(/\./g, "").replace(",", "."));
    return isNaN(v) ? null : v;
  };
  const brData = s => {
    const m = s && s.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return m ? `${m[3]}-${m[2]}-${m[1]}` : null;
  };
  const campo = (t, rot) => {
    const m = t.match(new RegExp("^" + reEsc(rot) + "[ \\t]+(.+)$", "m"));
    return m ? m[1].trim() : null;
  };
  function periodo(s) {
    s = (s || "").trim();
    let m;
    if (/^\d{2}\/\d{4}$/.test(s)) return s;
    if ((m = s.match(/^(\S+) de (\d{4})$/i)) && MESES[m[1].toLowerCase()]) return String(MESES[m[1].toLowerCase()]).padStart(2,"0") + "/" + m[2];
    if ((m = s.match(/^\d{2}\/(\d{2})\/(\d{4})$/))) return m[1] + "/" + m[2];
    return s;
  }
  function limpar(paginas) {
    return paginas.map(t => {
      const ls = t.split("\n");
      return ls.filter((l, i) => {
        const s = l.trim();
        if (s.startsWith("Receita Federal do Brasil") || s.startsWith("PEDIDO DE RESTITUIÇÃO")) return false;
        if (new RegExp(`^CNPJ [\\d./-]+ ${NUM}$`).test(s)) return false;
        if (i === ls.length - 1 && /^\d+$/.test(s)) return false;
        return true;
      }).join("\n");
    }).join("\n");
  }
  function debitos(t) {
    const heads = [...t.matchAll(/^(\d{3})\. Débito (.+)$/gm)];
    return heads.map((h, i) => {
      let blk = t.slice(h.index + h[0].length, i + 1 < heads.length ? heads[i + 1].index : t.length);
      const tot = blk.search(/^TOTAL\s/m);
      if (tot >= 0) blk = blk.slice(0, tot);
      const d = {seq: Number(h[1]), grupo: h[2].trim(), codigo_receita: "", denominacao: ""};
      const mc = blk.match(/^Código da Receita\/Denominação\s+([\s\S]+?)\n(?=Débito Controlado|Período)/m);
      const cod = mc ? mc[1].split(/\s+/).join(" ") : null;
      if (cod) {
        const m = cod.match(/^(\d{4}-\d{2})\s*-\s*(.*)$/);
        if (m) { d.codigo_receita = m[1]; d.denominacao = m[2].trim(); } else d.denominacao = cod;
      }
      d.periodo_apuracao = periodo(campo(blk, "Período Apuração DCTFWeb") || campo(blk, "Período de Apuração") || "");
      d.vencimento = brData(campo(blk, "Data de Vencimento do Tributo/Quota"));
      d.principal = brNum(campo(blk, "Principal")) || 0;
      d.multa = brNum(campo(blk, "Multa")) || 0;
      d.juros = brNum(campo(blk, "Juros")) || 0;
      d.total = brNum(campo(blk, "Total")) ?? r2(d.principal + d.multa + d.juros);
      return d;
    });
  }
  // Bloco "ORIGEM DO CRÉDITO" (pagamento indevido ou a maior): um item por DARF
  function origemCredito(t) {
    const ini = t.search(/^ORIGEM DO CRÉDITO/m);
    if (ini < 0) return null;
    let sec = t.slice(ini).split("\n").slice(1).join("\n");
    const fim = sec.search(/^(CRÉDITO|DÉBITO|DADOS|IDENTIFICAÇÃO|PAGAMENTOS|TOTAL)\b/m);
    if (fim >= 0) sec = sec.slice(0, fim);
    const itens = [...sec.matchAll(/^(\d+)\.\s*Período de Apuração\s+(\S+)/gm)];
    const lista = itens.map((m, i) => {
      const blk = sec.slice(m.index, i + 1 < itens.length ? itens[i + 1].index : sec.length);
      const cod = (campo(blk, "Código da Receita") || "").match(/\d{4}(-\d{2})?/);
      return {
        periodo: periodo(m[2]), periodo_apuracao: brData(m[2]),
        codigo: cod ? cod[0] : "",
        documento: campo(blk, "Número do Documento de Arrecadação"),
        data_arrecadacao: brData(campo(blk, "Data de Arrecadação")),
        principal: brNum(campo(blk, "Valor do Principal")), multa: brNum(campo(blk, "Valor da Multa")),
        juros: brNum(campo(blk, "Valor dos Juros")), total: brNum(campo(blk, "Valor Total")),
      };
    });
    return lista.length ? lista : null;
  }

  function interpretar(paginas) {
    const raw = paginas.join("\n");
    const m = raw.match(new RegExp(`CNPJ ([\\d./-]+) (${NUM})`));
    if (!m) throw new Error("Número do PER/DCOMP não encontrado. O arquivo não parece ser um PER/DCOMP.");
    const t = limpar(paginas);
    const doc = {numero: m[2], cnpj: m[1], avisos: []};
    doc.nome_empresa = campo(t, "Nome Empresarial") || "";
    doc.tipo_documento = campo(t, "Tipo de Documento") || "";
    doc.tipo_credito = campo(t, "Tipo de Crédito") || "";
    doc.data_transmissao = brData(campo(t, "Data de Transmissão"));
    doc.retificador = /^sim/i.test(campo(t, "PER/DCOMP Retificador") || "");
    doc.numero_retificado = null;
    if (doc.retificador) {
      const r = t.match(new RegExp(`Retificad[oa]\\D{0,40}(${NUM})`));
      doc.numero_retificado = r ? r[1] : null;
      if (!r) doc.avisos.push("Documento retificador sem número do retificado identificado.");
    }
    doc.informado_outro = /^sim/i.test(campo(t, "Informado em Outro PER/DCOMP") || "");
    const ini = t.match(new RegExp(`Nº do PER/DCOMP Inicial\\s+(${NUM})`));
    doc.numero_inicial = ini ? ini[1] : null;
    doc.exercicio = campo(t, "Exercício");
    doc.forma_apuracao = campo(t, "Forma de Apuração");
    doc.periodo_ini = brData(campo(t, "Data Inicial do Período"));
    doc.periodo_fim = brData(campo(t, "Data Final do Período"));
    doc.data_arrecadacao = brData(campo(t, "Data de Arrecadação"));
    doc.selic_pdf = brNum(campo(t, "Selic Acumulada"));
    doc.valor_saldo_negativo = brNum(campo(t, "Valor do Saldo Negativo"));
    doc.credito_original_entrega = brNum(campo(t, "Crédito Original na Data da Entrega"))
      ?? brNum(campo(t, "Valor Original do Crédito Inicial")) ?? brNum(campo(t, "Valor Original do Crédito"));
    doc.credito_atualizado = brNum(campo(t, "Crédito Atualizado"));
    doc.total_debitos = brNum(campo(t, "Total dos débitos desta DCOMP"));
    doc.credito_utilizado = brNum(campo(t, "Total do Crédito Original Utilizado nesta DCOMP"));
    doc.saldo_credito_original = brNum(campo(t, "Saldo do Crédito Original"));
    doc.valor_pedido = brNum(campo(t, "Valor do Pedido de Restituição") || campo(t, "Valor do Pedido de Ressarcimento")
                             || campo(t, "Valor do Pedido de Reembolso"));
    doc.origem_credito = origemCredito(t);
    if (!doc.data_arrecadacao && doc.origem_credito?.length) doc.data_arrecadacao = doc.origem_credito[0].data_arrecadacao;
    doc.debitos = [];
    if (/compensa/i.test(doc.tipo_documento)) {
      doc.debitos = debitos(t);
      const soma = r2(doc.debitos.reduce((s, d) => s + d.total, 0));
      if (doc.total_debitos == null && doc.debitos.length) doc.total_debitos = soma;
      if (doc.total_debitos != null && Math.abs(soma - doc.total_debitos) > 0.01)
        doc.avisos.push(`Soma dos débitos lidos (${n2(soma)}) difere do total da DCOMP (${n2(doc.total_debitos)}).`);
    }
    if (doc.credito_original_entrega == null && doc.valor_pedido == null)
      doc.avisos.push("Valor do crédito original não identificado no PDF. Informe na tela do crédito.");
    return doc;
  }
  async function lerPdf(buf) { return interpretar(await textoPaginas(buf)); }
  return {lerPdf, interpretar, textoPaginas, origemCredito};
})();

// =====================================================================
// CÁLCULO: créditos, conta-corrente e Selic
//   Selic acumulada na data D = soma das taxas mensais do mês de início
//   até o mês anterior ao de D + 1% no mês de D.
//   Crédito original utilizado = débitos / (1 + Selic acumulada).
// =====================================================================
const Calc = (() => {
  const idx = ym => { const [y, m] = ym.split("-").map(Number); return y * 12 + m - 1; };
  const ym = k => `${Math.floor(k / 12)}-${String(k % 12 + 1).padStart(2, "0")}`;

  function selicAcumulada(inicio, dataRef, tab) {
    if (!inicio || !dataRef) return {v: null, faltam: []};
    const ini = idx(inicio), ref = idx(dataRef.slice(0, 7));
    if (ref < ini) return {v: 0, faltam: []};
    let soma = 0; const faltam = [];
    for (let k = ini; k < ref; k++) { const c = ym(k); if (c in tab) soma += tab[c]; else faltam.push(c); }
    return {v: r2(soma + 1), faltam};
  }

  // Saldo negativo: mês seguinte ao encerramento do período. Pagamento indevido: mês seguinte ao pagamento.
  function inicioPadrao(d) {
    const tc = (d.tipo_credito || "").toLowerCase();
    let base = null;
    if (tc.includes("saldo negativo") && d.periodo_fim) base = d.periodo_fim;
    else if ((tc.includes("indevido") || tc.includes("a maior")) && d.data_arrecadacao) base = d.data_arrecadacao;
    return base ? ym(idx(base.slice(0, 7)) + 1) : null;
  }

  function montar(docs, params, ajustes, tab, dataPos) {
    const porNum = Object.fromEntries(docs.map(d => [d.numero, d]));
    const raiz = d => {
      const vistos = new Set(); let cur = d;
      while (cur.numero_inicial && !vistos.has(cur.numero)) {
        vistos.add(cur.numero);
        const nx = porNum[cur.numero_inicial];
        if (!nx) return cur.numero_inicial;
        cur = nx;
      }
      return cur.numero;
    };
    const grupos = {};
    for (const d of docs) (grupos[raiz(d)] ||= []).push(d);

    const lista = [];
    for (const [numero, gdocs] of Object.entries(grupos)) {
      const origem = porNum[numero];
      const ref = origem || [...gdocs].sort((a, b) =>
        (a.data_transmissao || "").localeCompare(b.data_transmissao || "") || (num(b.credito_original_entrega) || 0) - (num(a.credito_original_entrega) || 0))[0];
      const p = params[numero] || {};
      let padrao = null;
      for (const d of [ref, ...gdocs]) { padrao = inicioPadrao(d); if (padrao) break; }
      const avisos = [];
      let valorPdf;
      if (origem) valorPdf = num(origem.credito_original_entrega) ?? num(origem.valor_pedido) ?? num(origem.valor_saldo_negativo);
      else {
        valorPdf = num(ref.credito_original_entrega);
        avisos.push(`PER/DCOMP de origem ${numero} não importado. Valor inicial assumido a partir da DCOMP ${ref.numero}; importe o documento de origem para conferência completa.`);
      }
      const valor = p.valor_credito != null ? num(p.valor_credito) : (valorPdf || 0);
      const selicIni = p.selic_inicio || padrao;
      if (!selicIni) avisos.push("Mês de início da Selic não definido para este tipo de crédito. Defina na tela do crédito.");
      const c = {
        numero, cnpj: ref.cnpj, nome_empresa: ref.nome_empresa, tipo_credito: ref.tipo_credito,
        tipo_documento: origem ? origem.tipo_documento : "(não importado)",
        data_transmissao: origem ? origem.data_transmissao : null,
        periodo: ref.periodo_ini && ref.periodo_fim ? `${dt(ref.periodo_ini)} a ${dt(ref.periodo_fim)}` : "",
        origem: (origem || ref).origem_credito || gdocs.find(d => d.origem_credito)?.origem_credito || null,
        valor_original: r2(valor), selic_inicio: selicIni, selic_inicio_padrao: padrao,
        observacao: p.observacao || "", status: origem ? origem.status : "", avisos, movimentos: [],
        total_utilizado: 0, total_compensado: 0,
      };
      contaCorrente(c, gdocs, ajustes.filter(a => a.numero_credito === numero), tab, dataPos);
      lista.push(c);
    }
    lista.sort((a, b) => (a.nome_empresa || "").localeCompare(b.nome_empresa || "") ||
      (a.tipo_credito || "").localeCompare(b.tipo_credito || "") || a.periodo.localeCompare(b.periodo));
    return lista;
  }

  function contaCorrente(c, docs, ajustes, tab, dataPos) {
    const ev = [];
    for (const d of docs) {
      if (!/compensa/i.test(d.tipo_documento || "")) continue;
      ev.push({data: d.data_transmissao || "9999-12-31", ord: 0, k: -(num(d.credito_original_entrega) || 0), id: d.numero, tipo: "D", d});
    }
    for (const a of ajustes) ev.push({data: a.data, ord: 1, k: 0, id: String(a.id), tipo: "A", d: a});
    // no mesmo dia, a DCOMP com maior saldo na entrega foi transmitida antes
    ev.sort((x, y) => x.data.localeCompare(y.data) || x.ord - y.ord || x.k - y.k || x.id.localeCompare(y.id));

    let saldo = c.valor_original;
    const faltasTot = new Set();
    for (const e of ev) {
      const d = e.d;
      if (e.tipo === "A") {
        const v = r2(num(d.valor_original));
        const selAj = selicAcumulada(c.selic_inicio, e.data, tab).v;
        c.movimentos.push({data: e.data, tipo: "Ajuste", numero: d.descricao || "Ajuste manual", status: "",
          saldo_antes: saldo, selic: selAj, selic_pdf: null, total_debitos: 0, utilizado: v, juros: 0,
          saldo_depois: r2(saldo - v), saldo_atualizado_depois: selAj == null ? null : r2((saldo - v) * (1 + selAj / 100)),
          divergencias: [], ajuste_id: d.id});
        saldo = r2(saldo - v);
        continue;
      }
      const excl = STATUS_EXCLUIDOS.has(d.status);
      const {v: selCalc, faltam} = selicAcumulada(c.selic_inicio, d.data_transmissao, tab);
      faltam.forEach(f => faltasTot.add(f));
      const total = num(d.total_debitos) || 0;
      const sel = selCalc ?? num(d.selic_pdf) ?? 0;
      const fator = 1 + sel / 100;
      const utilCalc = excl ? 0 : r2(Math.min(total / fator, saldo));
      let util = num(d.credito_utilizado) ?? utilCalc;
      if (excl) util = 0;
      const juros = util ? r2(Math.min(total, util * fator) - util) : 0;
      const div = [];
      if (!excl) {
        if (faltam.length) div.push(`Selic sem taxa cadastrada para: ${faltam.map(mesAno).join(", ")}`);
        if (selCalc != null && d.selic_pdf != null && Math.abs(selCalc - num(d.selic_pdf)) > 0.005)
          div.push(`Selic do PDF ${pct(d.selic_pdf)} x calculada ${pct(selCalc)}`);
        if (d.credito_original_entrega != null && Math.abs(num(d.credito_original_entrega) - saldo) > TOL)
          div.push(`Saldo informado na DCOMP (${n2(d.credito_original_entrega)}) difere do saldo controlado (${n2(saldo)})`);
        if (d.credito_utilizado != null && Math.abs(num(d.credito_utilizado) - utilCalc) > TOL)
          div.push(`Crédito utilizado no PDF (${n2(d.credito_utilizado)}) x calculado (${n2(utilCalc)})`);
        if (util > saldo + TOL) div.push("Utilização maior que o saldo disponível");
      }
      const novo = r2(saldo - util);
      c.movimentos.push({data: d.data_transmissao, tipo: "DCOMP", numero: d.numero, status: d.status, documento_id: d.id,
        saldo_antes: saldo, selic: selCalc ?? num(d.selic_pdf), selic_pdf: num(d.selic_pdf),
        total_debitos: excl ? 0 : total, utilizado: util, juros, saldo_depois: novo,
        // equivale à coluna "Total atualizado após compensação" da planilha: saldo restante corrigido pela Selic da DCOMP
        saldo_atualizado_depois: r2(novo * fator), divergencias: div});
      if (!excl) { c.total_utilizado += util; c.total_compensado += total; }
      saldo = novo;
    }
    c.saldo_original = r2(saldo);
    c.total_utilizado = r2(c.total_utilizado);
    c.total_compensado = r2(c.total_compensado);
    const {v, faltam} = selicAcumulada(c.selic_inicio, dataPos, tab);
    faltam.forEach(f => faltasTot.add(f));
    c.selic_hoje = v;
    c.saldo_atualizado = v == null ? null : r2(c.saldo_original * (1 + v / 100));
    if (faltam.length) c.avisos.push(`Taxa Selic não cadastrada para ${faltam.map(mesAno).join(", ")}. Atualize a tabela Selic.`);
  }

  // Primeiro mês: 1%. Demais: taxa do mês anterior sobre o saldo original no início do mês.
  function apropriar(c, ate, tab) {
    if (!c.selic_inicio) return [];
    const out = [];
    for (let k = idx(c.selic_inicio); k <= idx(ate.slice(0, 7)); k++) {
      const inicioMes = ym(k) + "-01";
      const saldo = r2(c.valor_original - c.movimentos.filter(m => m.data < inicioMes).reduce((s, m) => s + m.utilizado, 0));
      if (saldo <= 0.005) break;
      const taxa = k === idx(c.selic_inicio) ? 1 : (tab[ym(k - 1)] ?? null);
      out.push({competencia: mesAno(ym(k)), saldo, taxa, selic: taxa == null ? null : r2(saldo * taxa / 100)});
    }
    return out;
  }
  return {montar, apropriar, selicAcumulada, inicioPadrao};
})();

let sb = null;
const S = {user: null, docs: [], params: {}, ajustes: [], selic: {}, selicLinhas: [], cnpj: "", view: "painel",
           creditoSel: null, abaCredito: "cc", dataPos: hojeISO(), importacao: [], aviso: null};

function cfg() {
  return {url: SUPABASE_URL || localStorage.getItem("pd_url") || "", key: SUPABASE_ANON_KEY || localStorage.getItem("pd_key") || ""};
}

async function todos(tabela, ordem) {
  const out = []; const lote = 1000;
  for (let i = 0; ; i += lote) {
    let q = sb.from(tabela).select("*").range(i, i + lote - 1);
    if (ordem) q = q.order(ordem);
    const {data, error} = await q;
    if (error) throw error;
    out.push(...data);
    if (data.length < lote) return out;
  }
}

async function carregarDados() {
  const [docs, params, ajustes, selic] = await Promise.all([
    todos("documentos", "id"), todos("creditos"), todos("ajustes", "data"), todos("selic", "competencia")]);
  S.docs = docs;
  S.params = Object.fromEntries(params.map(p => [p.numero, p]));
  S.ajustes = ajustes;
  S.selicLinhas = selic.reverse();
  S._empresas = null;
  S.selic = Object.fromEntries(selic.map(s => [s.competencia, Number(s.taxa)]));
}

async function atualizarSelicSeNecessario() {
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
  const ant = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  if (S.selic[ant] != null) return;
  const {error} = await sb.rpc("atualizar_selic", {ano_inicial: S.selicLinhas.length ? d.getFullYear() - 1 : 2000});
  if (error) S.aviso = `Não foi possível atualizar a Selic pelo Banco Central (${error.message}). Use a página Tabela Selic.`;
  else await carregarDados();
}

async function debitosDe(ids) {
  if (!ids.length) return [];
  const out = [];
  for (let i = 0; i < ids.length; i += 200) {
    const {data, error} = await sb.from("debitos").select("*").in("documento_id", ids.slice(i, i + 200)).order("seq");
    if (error) throw error;
    out.push(...data);
  }
  return out;
}

// Origem do crédito de pagamento indevido ou a maior: códigos de receita e períodos de apuração dos DARFs
function origemInfo(c) {
  const o = Array.isArray(c.origem) ? c.origem : [];
  if (!o.length) return null;
  const unicos = a => [...new Set(a.filter(Boolean))];
  return {
    codigos: unicos(o.map(x => x.codigo)).join(", "),
    periodos: unicos(o.map(x => x.periodo)).join(", "),
    detalhe: o.map(x => `DARF ${x.codigo || "?"}, PA ${x.periodo || "?"}, arrecadado em ${dt(x.data_arrecadacao) || "?"}, total ${n2(x.total)}`).join("; "),
  };
}
const periodoTxt = c => c.periodo || (origemInfo(c) ? "PA " + origemInfo(c).periodos : "");
const codigoTxt = c => origemInfo(c)?.codigos || "";

const docsFiltrados = () => S.cnpj ? S.docs.filter(d => d.cnpj === S.cnpj) : S.docs;
const creditos = () => Calc.montar(docsFiltrados(), S.params, S.ajustes, S.selic, S.dataPos);

// ---------------- Busca de empresa (razão social ou CNPJ) ----------------
const normTxt = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const soDigitos = s => String(s || "").replace(/\D/g, "");

// Uma linha por CNPJ, com quantidade de créditos e saldo original (recalculado quando os dados mudam)
function empresas() {
  if (S._empresas) return S._empresas;
  const mapa = {};
  for (const c of Calc.montar(S.docs, S.params, S.ajustes, S.selic, hojeISO())) {
    const e = mapa[c.cnpj] ||= {cnpj: c.cnpj, nome: c.nome_empresa || "", creditos: 0, saldo: 0};
    e.creditos++; e.saldo += c.saldo_original || 0;
  }
  for (const d of S.docs) mapa[d.cnpj] ||= {cnpj: d.cnpj, nome: d.nome_empresa || "", creditos: 0, saldo: 0};
  return S._empresas = Object.values(mapa).map(e => ({...e, n: normTxt(e.nome), dig: soDigitos(e.cnpj)}))
    .sort((a, b) => a.nome.localeCompare(b.nome));
}

function buscarEmpresas(q) {
  const nq = normTxt(q), dq = soDigitos(q);
  const termos = nq.split(/\s+/).filter(Boolean);
  const peso = e => e.n.startsWith(nq) || (dq && e.dig.startsWith(dq)) ? 0 : 1;
  return empresas().filter(e =>
      termos.every(t => e.n.includes(t)) || (dq.length >= 2 && e.dig.includes(dq)) || normTxt(e.cnpj).includes(nq))
    .sort((a, b) => peso(a) - peso(b) || a.nome.localeCompare(b.nome));
}

function lerRecentes() { try { return JSON.parse(localStorage.getItem("pd_emp_recentes") || "[]"); } catch { return []; } }
function guardarRecente(cnpj) {
  try { localStorage.setItem("pd_emp_recentes", JSON.stringify([cnpj, ...lerRecentes().filter(c => c !== cnpj)].slice(0, 6))); } catch {}
}

function selecionarEmpresa(cnpj) {
  S.cnpj = cnpj || ""; S.creditoSel = null; S.trocandoEmp = false;
  if (cnpj) guardarRecente(cnpj);
  render();
}

function destacarTrecho(texto, q) {
  const nq = normTxt(q);
  if (!nq) return esc(texto);
  const i = normTxt(texto).indexOf(nq);   // normalização preserva o comprimento em textos com acento comum
  if (i < 0) return esc(texto);
  return esc(texto.slice(0, i)) + "<mark>" + esc(texto.slice(i, i + nq.length)) + "</mark>" + esc(texto.slice(i + nq.length));
}

function ligarBuscaEmpresa() {
  const chip = $("#empChip");
  if (chip) {
    $("#empLimpar").onclick = ev => { ev.stopPropagation(); selecionarEmpresa(""); };
    chip.onclick = () => { S.trocandoEmp = true; render(); $("#empBusca")?.focus(); };
    return;
  }
  const inp = $("#empBusca"), box = $("#empSug");
  let itens = [], ativo = -1;
  const linhaEmp = (e, q) => `<div class="item" role="option" data-cnpj="${esc(e.cnpj)}">
      <span class="l1">${destacarTrecho(e.nome, q)}</span>
      <span class="l2">${destacarTrecho(e.cnpj, q)} · ${e.creditos} crédito(s) · saldo original ${brl(e.saldo)}</span></div>`;
  function abrir() {
    const q = inp.value.trim();
    let html = "";
    if (!q) {
      const rec = lerRecentes().map(c => empresas().find(e => e.cnpj === c)).filter(Boolean);
      itens = [{cnpj: ""}, ...rec];
      html = `<div class="item" role="option" data-cnpj=""><span class="l1">Todas as empresas</span>
                <span class="l2">${empresas().length} empresa(s) cadastrada(s)</span></div>`
        + (rec.length ? `<div class="grupo">Consultadas recentemente</div>` + rec.map(e => linhaEmp(e, "")).join("")
                      : `<div class="vazio">Digite parte da razão social ou do CNPJ.</div>`);
    } else {
      const achados = buscarEmpresas(q);
      itens = achados.slice(0, 50);
      html = itens.length ? itens.map(e => linhaEmp(e, q)).join("")
        + (achados.length > 50 ? `<div class="vazio">Mais ${achados.length - 50} empresa(s). Refine a busca.</div>` : "")
        : `<div class="vazio">Nenhuma empresa encontrada para "${esc(q)}".</div>`;
    }
    box.innerHTML = html;
    box.classList.remove("oculto");
    inp.setAttribute("aria-expanded", "true");
    ativo = q && itens.length ? 0 : -1;
    marcar();
    box.querySelectorAll(".item").forEach((el, i) => {
      el.onmousedown = ev => { ev.preventDefault(); selecionarEmpresa(el.dataset.cnpj); };
    });
  }
  function fechar() { box.classList.add("oculto"); inp.setAttribute("aria-expanded", "false"); }
  function marcar() {
    box.querySelectorAll(".item").forEach((el, i) => el.classList.toggle("ativo", i === ativo));
    box.querySelectorAll(".item")[ativo]?.scrollIntoView({block: "nearest"});
  }
  inp.onfocus = abrir;
  inp.oninput = abrir;
  inp.onblur = () => setTimeout(() => { fechar(); if (S.trocandoEmp) { S.trocandoEmp = false; render(); } }, 150);
  inp.onkeydown = ev => {
    if (ev.key === "ArrowDown") { ev.preventDefault(); if (box.classList.contains("oculto")) abrir(); ativo = Math.min(ativo + 1, itens.length - 1); marcar(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); ativo = Math.max(ativo - 1, 0); marcar(); }
    else if (ev.key === "Enter") { ev.preventDefault(); if (itens[ativo]) selecionarEmpresa(itens[ativo].cnpj); }
    else if (ev.key === "Escape") { inp.value = ""; fechar(); inp.blur(); }
  };
}

  const empSel = S.cnpj ? empresas().find(e => e.cnpj === S.cnpj) : null;

                 ["documentos","Documentos"],["selic","Tabela Selic"]];
  $("#app").innerHTML = `

               placeholder="Todas as empresas: busque por razão social ou CNPJ">`}

      <a class="link" href="#senha" style="font-weight:600;color:var(--azul)">Trocar senha</a>

}

// ---------------- Troca de senha ----------------
// modo: "obrigatoria" (primeiro acesso), "voluntaria" (link Trocar senha) ou "recuperacao" (link do e-mail)
function telaSenha(modo) {
  const obrigatoria = modo !== "voluntaria";
  const recuperacao = modo === "recuperacao";
  const html = `
    <form class="login" id="frmSenha" style="${obrigatoria ? "" : "margin-top:10px"}">
      ${obrigatoria ? `<img src="${LOGO}" alt="Irko">` : ""}
      <h1>${recuperacao ? "Crie uma nova senha" : obrigatoria ? "Defina sua senha" : "Trocar senha"}</h1>
      ${recuperacao ? `<p class="sub">Recuperação de acesso de ${esc(S.user.email)}.</p>`
        : obrigatoria ? `<p class="sub">Primeiro acesso de ${esc(S.user.email)}: troque a senha inicial recebida por uma senha pessoal.</p>` : ""}
      <div id="senhaMsg"></div>
      ${recuperacao ? "" : `<label>Senha atual<input type="password" id="sAtual" autocomplete="current-password" required></label>`}
      <label>Nova senha<input type="password" id="sNova" autocomplete="new-password" required></label>
      <label>Confirme a nova senha<input type="password" id="sConf" autocomplete="new-password" required></label>
      <p class="nota">Mínimo de 8 caracteres, com letras e números. Não reutilize senhas de outros sistemas.</p>
      <button class="prim" type="submit">Salvar nova senha</button>
      ${obrigatoria ? `<button type="button" class="link" id="sSair">Sair</button>`
                    : `<button type="button" class="link" id="sVoltar">Voltar</button>`}
    </form>`;
  if (obrigatoria) $("#app").innerHTML = html;
  else $("#conteudo").insertAdjacentHTML("beforeend", html);
  const erro = m => { $("#senhaMsg").innerHTML = `<div class="msg erro">${esc(m)}</div>`; };
  if (obrigatoria) $("#sSair").onclick = async () => { await sb.auth.signOut(); S.user = null; S.trocaObrigatoria = false; S.recuperacao = false; render(); };
  else $("#sVoltar").onclick = () => history.back();
  $("#frmSenha").onsubmit = async e => {
    e.preventDefault();
    const atual = recuperacao ? null : $("#sAtual").value, nova = $("#sNova").value, conf = $("#sConf").value;
    if (nova.length < 8 || !/[A-Za-z]/.test(nova) || !/\d/.test(nova)) return erro("A nova senha precisa ter pelo menos 8 caracteres, com letras e números.");
    if (nova !== conf) return erro("A confirmação não confere com a nova senha.");
    if (!recuperacao && nova === atual) return erro("A nova senha precisa ser diferente da atual.");
    carregando(true);
    try {
      // fora da recuperação, confirma a senha atual antes de trocar
      if (!recuperacao) {
        const r1 = await sb.auth.signInWithPassword({email: S.user.email, password: atual});
        if (r1.error) return erro("Senha atual incorreta.");
      }
      const {data, error} = await sb.auth.updateUser({password: nova, data: {senha_definida: true}});
      if (error) return erro(/different from the old/i.test(error.message) ? "A nova senha precisa ser diferente da anterior." : error.message);
      toast("Senha alterada.");
      if (obrigatoria) { S.trocaObrigatoria = false; S.recuperacao = false; location.hash = "painel"; await entrar(data.user); }
      else { S.user = data.user; location.hash = "painel"; }
    } finally { carregando(false); }
  };
}

function telaLogin(erro) {
  $("#app").innerHTML = `
    <form class="login" id="frmLogin">
      <img src="${LOGO}" alt="Irko">
      <h1>Controle de PER/DCOMP</h1>
      ${erro ? `<div class="msg erro">${esc(erro)}</div>` : ""}
      <label>E-mail<input type="email" id="lgEmail" autocomplete="username" required></label>
      <label>Senha<input type="password" id="lgSenha" autocomplete="current-password" required></label>
      <button class="prim" type="submit">Entrar</button>
      <button type="button" class="link" id="lgEsqueci">Esqueci minha senha</button>
      <p class="nota">Acesso restrito a usuários Irko cadastrados pelo administrador.
        <a href="guia.html" target="_blank" rel="noopener">Veja o guia de uso</a>.</p>
      ${SUPABASE_URL ? "" : `<button type="button" class="link" id="lgCfg">Alterar configuração do Supabase</button>`}
    </form>`;
  $("#frmLogin").onsubmit = async e => {
    e.preventDefault();
    carregando(true);
    const {data, error} = await sb.auth.signInWithPassword({email: $("#lgEmail").value.trim(), password: $("#lgSenha").value});
    carregando(false);
    if (error) return telaLogin(error.message === "Invalid login credentials" ? "E-mail ou senha inválidos." : error.message);

  if (b) b.onclick = () => { localStorage.removeItem("pd_url"); localStorage.removeItem("pd_key"); render(); };
}

function cards(itens) {
  return `<div class="cards">${itens.map(([r, v, d]) => `<div class="card ${d ? "destaque" : ""}"><div class="rot">${esc(r)}</div><div class="val">${v}</div></div>`).join("")}</div>`;
}

function tabela(cols, linhas, rodape) {
  return `<div class="tabela-wrap"><table>
    <thead><tr>${cols.map(c => `<th class="${c.n ? "n" : ""}">${esc(c.t)}</th>`).join("")}</tr></thead>
    <tbody>${linhas.join("")}</tbody>${rodape ? `<tfoot>${rodape}</tfoot>` : ""}</table></div>`;
}

  const nAlertas = c => c.avisos.length + c.movimentos.reduce((s, m) => s + m.divergencias.length, 0);
  main.insertAdjacentHTML("beforeend", `

      <label>Posição em<input type="date" id="dataPos" value="${S.dataPos}"></label>

        <td>${nAlertas(c) ? `<span class="tag alerta">${nAlertas(c)} alerta(s)</span>` : `<span class="tag ok">OK</span>`}</td></tr>`),
      `<tr><td colspan="6">Total</td><td class="n">${n2(soma("valor_original"))}</td><td class="n">${n2(soma("total_utilizado"))}</td>
        <td class="n">${n2(soma("saldo_original"))}</td><td></td><td class="n">${n2(soma("saldo_atualizado"))}</td><td colspan="2"></td></tr>`)
      + `<p class="nota">Clique em um crédito para abrir o extrato.</p>`
    : S.cnpj ? `<div class="msg info">Nenhum crédito ${so ? "com saldo " : ""}para a empresa selecionada.</div>`

// ---------------- Extrato do crédito ----------------
async function telaCredito(main) {
  const lista = creditos();
  if (!lista.length) {
    main.insertAdjacentHTML("beforeend", `<h1>Extrato do crédito</h1><div class="msg info">${S.cnpj
      ? "Nenhum crédito para a empresa selecionada. Clique no × ao lado do nome da empresa, no topo, para ver todas."
      : "Nenhum crédito cadastrado."}</div>`);
    return;
  }
  if (!lista.find(c => c.numero === S.creditoSel)) S.creditoSel = lista[0].numero;
  const c = lista.find(x => x.numero === S.creditoSel);
  const aba = S.abaCredito;
  main.insertAdjacentHTML("beforeend", `
    <h1>Extrato do crédito</h1>
    <div class="barra">
      <label style="flex:1;min-width:280px">Crédito
        <select id="selCredito">${lista.map(x => `<option value="${esc(x.numero)}" ${x.numero === c.numero ? "selected" : ""}>
          ${esc(x.nome_empresa)} | ${esc(x.tipo_credito)}${codigoTxt(x) ? " " + esc(codigoTxt(x)) : ""} | ${esc(periodoTxt(x) || "sem período")} | ${esc(x.numero)}</option>`).join("")}</select>
      </label>
      <label>Posição em<input type="date" id="dataPos" value="${S.dataPos}"></label>
      <button id="btnExcel">Exportar para Excel</button>
    </div>
    ${c.avisos.map(a => `<div class="msg aviso">${esc(a)}</div>`).join("")}
    ${cards([["Valor original", brl(c.valor_original)], ["Crédito original utilizado", brl(c.total_utilizado)],
             ["Saldo original", brl(c.saldo_original)], [`Selic acumulada em ${dt(S.dataPos)}`, pct(c.selic_hoje)],
             ["Saldo atualizado", brl(c.saldo_atualizado), true]])}
    ${origemInfo(c) ? `<div class="msg info"><b>Origem do crédito:</b> ${esc(origemInfo(c).detalhe)}</div>` : ""}
    <p class="sub">${esc(c.nome_empresa)} | CNPJ ${esc(c.cnpj)} | ${esc(c.tipo_credito)} | Período ${esc(periodoTxt(c) || "-")} |
      Origem: ${esc(c.tipo_documento)} ${esc(c.numero)}${c.data_transmissao ? ` transmitido em ${dt(c.data_transmissao)}` : ""} |
      Início da Selic: ${mesAno(c.selic_inicio)}</p>
    <div class="abas">
      ${[["cc","Conta-corrente"],["deb","Débitos compensados"],["apr","Selic a apropriar"],["par","Parâmetros e ajustes"]]
        .map(([k, t]) => `<button data-aba="${k}" class="${aba === k ? "ativo" : ""}">${t}</button>`).join("")}
    </div>
    <div id="abaConteudo"></div>`);
  $("#selCredito").onchange = e => { S.creditoSel = e.target.value; render(); };
  $("#dataPos").onchange = e => { S.dataPos = e.target.value || hojeISO(); render(); };
  $("#btnExcel").onclick = () => exportarExcel([c]);
  main.querySelectorAll(".abas button").forEach(b => b.onclick = () => { S.abaCredito = b.dataset.aba; render(); });
  const box = $("#abaConteudo");

  if (aba === "cc") {
    box.innerHTML = c.movimentos.length ? tabela(
      [{t:"Data"},{t:"Tipo"},{t:"PER/DCOMP"},{t:"Status"},{t:"Saldo original antes",n:1},{t:"Selic acum.",n:1},{t:"Selic PDF",n:1},
       {t:"Total dos débitos",n:1},{t:"Crédito original utilizado",n:1},{t:"Selic utilizada",n:1},{t:"Saldo original após",n:1},{t:"Saldo atualizado após",n:1},{t:"Conferência"}],
      c.movimentos.map(m => `<tr><td>${dt(m.data)}</td><td>${m.tipo}</td><td>${esc(m.numero)}</td><td>${esc(m.status)}</td>
        <td class="n">${n2(m.saldo_antes)}</td><td class="n">${pct(m.selic)}</td><td class="n">${pct(m.selic_pdf)}</td>
        <td class="n">${n2(m.total_debitos)}</td><td class="n">${n2(m.utilizado)}</td><td class="n">${n2(m.juros)}</td>
        <td class="n">${n2(m.saldo_depois)}</td><td class="n">${n2(m.saldo_atualizado_depois)}</td>
        <td>${m.divergencias.length ? m.divergencias.map(d => `<span class="tag alerta">${esc(d)}</span>`).join("<br>") : `<span class="tag ok">OK</span>`}</td></tr>`),
      `<tr><td colspan="7">Total</td><td class="n">${n2(c.total_compensado)}</td><td class="n">${n2(c.total_utilizado)}</td>
        <td class="n">${n2(c.movimentos.reduce((s, m) => s + m.juros, 0))}</td><td class="n">${n2(c.saldo_original)}</td><td></td><td></td></tr>`)
      + `<p class="nota">Selic acumulada = soma das taxas mensais do mês de início até o mês anterior ao da transmissão + 1% no mês da transmissão.
         Crédito utilizado = débitos / (1 + Selic). Saldo atualizado após = saldo original após × (1 + Selic da DCOMP), equivalente à coluna
         "Total atualizado após compensação" da planilha. Quando o PDF informa o crédito utilizado, prevalece o valor declarado; o cálculo serve de conferência.</p>`
      : `<div class="msg info">Nenhuma DCOMP vinculada a este crédito até o momento.</div>`;
  }
  if (aba === "deb") {
    box.innerHTML = "Carregando...";
    const ids = c.movimentos.filter(m => m.documento_id).map(m => m.documento_id);
    const docPorId = Object.fromEntries(S.docs.map(d => [d.id, d]));
    const debs = (await debitosDe(ids)).sort((a, b) =>
      (docPorId[a.documento_id].data_transmissao || "").localeCompare(docPorId[b.documento_id].data_transmissao || "") || a.documento_id - b.documento_id || a.seq - b.seq);
    const porCod = {};
    debs.forEach(d => { const k = d.codigo_receita + " " + d.denominacao; porCod[k] = (porCod[k] || 0) + num(d.total); });
    box.innerHTML = debs.length ? tabela(
      [{t:"Data DCOMP"},{t:"PER/DCOMP"},{t:"Grupo"},{t:"Código"},{t:"Denominação"},{t:"PA"},{t:"Vencimento"},
       {t:"Principal",n:1},{t:"Multa",n:1},{t:"Juros",n:1},{t:"Total",n:1}],
      debs.map(d => { const doc = docPorId[d.documento_id]; return `<tr><td>${dt(doc.data_transmissao)}</td><td>${esc(doc.numero)}</td>
        <td>${esc(d.grupo)}</td><td>${esc(d.codigo_receita)}</td><td>${esc(d.denominacao)}</td><td>${esc(d.periodo_apuracao)}</td>
        <td>${dt(d.vencimento)}</td><td class="n">${n2(d.principal)}</td><td class="n">${n2(d.multa)}</td>
        <td class="n">${n2(d.juros)}</td><td class="n">${n2(d.total)}</td></tr>`; }),
      `<tr><td colspan="10">Total</td><td class="n">${n2(debs.reduce((s, d) => s + num(d.total), 0))}</td></tr>`)
      + `<h2>Total por código de receita</h2>` + tabela([{t:"Código / denominação"},{t:"Total",n:1}],
        Object.entries(porCod).sort().map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${n2(v)}</td></tr>`))
      : `<div class="msg info">Nenhum débito compensado.</div>`;
  }
  if (aba === "apr") {
    const apr = Calc.apropriar(c, S.dataPos, S.selic);
    box.innerHTML = apr.length ? tabela([{t:"Competência"},{t:"Saldo original no início do mês",n:1},{t:"Taxa",n:1},{t:"Selic do mês",n:1}],
      apr.map(a => `<tr><td>${a.competencia}</td><td class="n">${n2(a.saldo)}</td><td class="n">${pct(a.taxa)}</td><td class="n">${n2(a.selic)}</td></tr>`),
      `<tr><td colspan="3">Total</td><td class="n">${n2(apr.reduce((s, a) => s + (a.selic || 0), 0))}</td></tr>`)
      + `<p class="nota">Primeiro mês: 1%. Demais meses: taxa Selic do mês anterior aplicada sobre o saldo original existente no início do mês.
         Critério de apropriação contábil sujeito à validação do responsável técnico.</p>`
      : `<div class="msg info">Defina o mês de início da Selic na aba Parâmetros e ajustes.</div>`;
  }
  if (aba === "par") {
    const p = S.params[c.numero] || {};
    const ajs = S.ajustes.filter(a => a.numero_credito === c.numero);
    box.innerHTML = `
      <div class="caixa">
        <h2 style="margin-top:0">Parâmetros do crédito</h2>
        <p class="nota">Início da Selic pelo tipo de crédito: <b>${c.selic_inicio_padrao ? mesAno(c.selic_inicio_padrao) : "não definido para este tipo"}</b>.
          Saldo negativo: mês seguinte ao encerramento do período. Pagamento indevido: mês seguinte ao pagamento.
          Ressarcimentos e demais casos dependem de análise do responsável técnico.</p>
        <div class="grid2">
          <label>Mês de início da Selic<input type="month" id="pIni" value="${esc(p.selic_inicio || c.selic_inicio_padrao || "")}"></label>
          <label>Valor original do crédito (vazio = valor do PDF)<input type="number" step="0.01" id="pValor" value="${p.valor_credito ?? ""}"></label>
        </div>
        <label style="margin-top:10px">Observação<textarea id="pObs">${esc(p.observacao || "")}</textarea></label>
        <div class="barra" style="margin:10px 0 0;align-items:center">
          <button class="prim" id="pSalvar">Salvar parâmetros</button>
          <span class="nota" style="margin:0">${p.atualizado_em
            ? `Última alteração por <b>${esc(p.atualizado_por || "usuário não identificado")}</b> em ${dataHora(p.atualizado_em)}.`
            : "Nenhuma alteração manual: o crédito usa os valores automáticos."}</span>
        </div>
      </div>
      <div class="caixa">
        <h2 style="margin-top:0">Ajustes manuais</h2>
        <p class="nota">Restituição recebida, glosa, despacho decisório ou outro evento que altere o saldo original. Valor positivo reduz o saldo; negativo aumenta.</p>
        ${ajs.length ? tabela([{t:"Data do evento"},{t:"Valor original",n:1},{t:"Descrição"},{t:"Lançado por"},{t:"Lançado em"},{t:""}],
          ajs.map(a => `<tr><td>${dt(a.data)}</td><td class="n">${n2(a.valor_original)}</td><td>${esc(a.descricao)}</td>
            <td>${esc(a.criado_por)}</td><td>${dataHora(a.criado_em)}</td>
            <td><button class="link" data-del="${a.id}">Excluir</button></td></tr>`)) : ""}
        <div class="barra" style="margin-top:12px">
          <label>Data<input type="date" id="aData" value="${hojeISO()}"></label>
          <label>Valor original<input type="number" step="0.01" id="aValor"></label>
          <label style="flex:1">Descrição<input id="aDesc"></label>
          <button id="aIncluir">Incluir ajuste</button>
        </div>
      </div>
      <div class="caixa">
        <h2 style="margin-top:0">Histórico de alterações</h2>
        <p class="nota">Registro automático de cada alteração de parâmetros e de cada ajuste incluído ou excluído, com usuário e data. Não pode ser editado.</p>
        <div id="historico">Carregando...</div>
      </div>`;
    sb.from("creditos_historico").select("*").eq("numero", c.numero).order("alterado_em", {ascending: false}).limit(200)
      .then(({data, error}) => {
        const h = $("#historico");
        if (!h) return;
        if (error) { h.innerHTML = `<div class="msg erro">Não foi possível carregar o histórico: ${esc(error.message)}</div>`; return; }
        h.innerHTML = data.length ? tabela([{t:"Data e hora"},{t:"Usuário"},{t:"Evento"},{t:"Detalhe"}],
            data.map(r => `<tr><td style="white-space:nowrap">${dataHora(r.alterado_em)}</td><td>${esc(r.alterado_por || "")}</td>
              <td style="white-space:nowrap">${esc(r.evento)}</td><td>${esc(r.detalhe || "")}</td></tr>`))
          : `<div class="msg info">Nenhuma alteração registrada para este crédito.</div>`;
      });
    $("#pSalvar").onclick = () => acao(async () => {
      const ini = $("#pIni").value || null, v = $("#pValor").value;
      // usuário e data são gravados pelo próprio banco
      const {error} = await sb.from("creditos").upsert({numero: c.numero, selic_inicio: ini === c.selic_inicio_padrao ? null : ini,
        valor_credito: v === "" ? null : Number(v), observacao: $("#pObs").value || null});
      if (error) throw error;
    }, "Parâmetros salvos.");
    $("#aIncluir").onclick = () => {
      const v = Number($("#aValor").value);
      if (!v || !$("#aData").value) return alert("Informe a data e um valor diferente de zero.");
      acao(async () => {
        const {error} = await sb.from("ajustes").insert({numero_credito: c.numero, data: $("#aData").value, valor_original: v, descricao: $("#aDesc").value || null});
        if (error) throw error;
      }, "Ajuste incluído.");
    };
    box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      if (!confirm("Excluir este ajuste?")) return;
      acao(async () => { const {error} = await sb.from("ajustes").delete().eq("id", b.dataset.del); if (error) throw error; }, "Ajuste excluído.");
    });
  }
}

      as DCOMPs seguintes são vinculadas pelo campo "Nº do PER/DCOMP Inicial" e abatem o saldo. A ordem de importação não importa.</p>
    <div class="drop" id="drop">Arraste os PDFs aqui ou clique para selecionar<input type="file" id="arqs" accept="application/pdf" multiple class="oculto"></div>
    <div id="previa"></div>`);
  const drop = $("#drop"), inp = $("#arqs");
  drop.onclick = () => inp.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("sobre"); };
  drop.ondragleave = () => drop.classList.remove("sobre");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("sobre"); lerArquivos([...e.dataTransfer.files]); };
  inp.onchange = () => lerArquivos([...inp.files]);
  mostrarPrevia();
}

async function lerArquivos(files) {
  files = files.filter(f => /\.pdf$/i.test(f.name));
  if (!files.length) return;
  carregando(true);
  S.importacao = [];
  for (const f of files) {
    const buf = await f.arrayBuffer();
    try { S.importacao.push({nome: f.name, buf, doc: await PD.lerPdf(buf.slice(0))}); }
    catch (e) { S.importacao.push({nome: f.name, erro: e.message}); }
  }
  carregando(false);
  mostrarPrevia();
}

function mostrarPrevia() {
  const box = $("#previa");
  if (!box || !S.importacao.length) return;
  const existe = new Set(S.docs.map(d => d.numero));
  const validos = S.importacao.filter(x => x.doc);
  const cnpjs = new Set(validos.map(x => x.doc.cnpj));
  box.innerHTML = `<h2>Prévia</h2>` + tabela(
    [{t:"Arquivo"},{t:"Situação"},{t:"Número"},{t:"Empresa"},{t:"Documento"},{t:"Tipo de crédito"},{t:"Transmissão"},
     {t:"PER/DCOMP inicial"},{t:"Selic",n:1},{t:"Crédito na entrega",n:1},{t:"Débitos",n:1},{t:"Utilizado",n:1},{t:"Observações"}],
    S.importacao.map(x => x.erro ? `<tr><td>${esc(x.nome)}</td><td><span class="tag erro">Erro</span></td><td colspan="11">${esc(x.erro)}</td></tr>` :
      `<tr><td>${esc(x.nome)}</td><td>${existe.has(x.doc.numero) ? `<span class="tag alerta">Já importado</span>` : `<span class="tag ok">Novo</span>`}</td>
       <td>${esc(x.doc.numero)}</td><td>${esc(x.doc.nome_empresa)}</td><td>${esc(x.doc.tipo_documento)}</td><td>${esc(x.doc.tipo_credito)}</td>
       <td>${dt(x.doc.data_transmissao)}</td><td>${esc(x.doc.numero_inicial || "")}</td><td class="n">${pct(x.doc.selic_pdf)}</td>
       <td class="n">${n2(x.doc.credito_original_entrega)}</td><td class="n">${n2(x.doc.total_debitos)}</td><td class="n">${n2(x.doc.credito_utilizado)}</td>
       <td>${x.doc.avisos.map(esc).join("<br>")}</td></tr>`))
    + (cnpjs.size > 1 ? `<div class="msg aviso" style="margin-top:12px">Os arquivos pertencem a ${cnpjs.size} CNPJs diferentes. Confira se a importação conjunta é intencional.</div>` : "")
    + `<div class="barra" style="margin-top:14px">
        <label class="inline"><input type="checkbox" id="substituir"> Reimportar os já importados (status e observações são mantidos)</label>
        <button class="prim" id="btnImportar">Importar</button></div><div id="resultado"></div>`;
  $("#btnImportar").onclick = async () => {
    const subst = $("#substituir").checked;
    const alvo = validos.filter(x => subst || !existe.has(x.doc.numero));
    if (!alvo.length) return alert("Nenhum documento novo para importar.");
    carregando(true);
    let ok = 0; const erros = [];
    for (const x of alvo) {
      try {
        const {debitos, avisos, ...doc} = x.doc;
        const caminho = `${doc.cnpj.replace(/\D/g, "")}/${doc.numero}.pdf`;
        const up = await sb.storage.from(BUCKET).upload(caminho, new Blob([x.buf], {type: "application/pdf"}), {upsert: true, contentType: "application/pdf"});
        if (up.error) throw up.error;
        doc.arquivo = caminho;
        const {error} = await sb.rpc("importar_documento", {p_doc: doc, p_debitos: debitos, p_substituir: subst});
        if (error) throw error;
        ok++;
      } catch (e) { erros.push(`${x.nome}: ${e.message}`); }
    }
    await carregarDados();
    carregando(false);
    S.importacao = [];
    render();
    $("#previa").innerHTML = `<div class="msg ok">${ok} documento(s) importado(s).</div>` + erros.map(e => `<div class="msg erro">${esc(e)}</div>`).join("");
  };
}

function lerConsSel() { try { return new Set(JSON.parse(localStorage.getItem("pd_cons_sel") || "[]")); } catch { return new Set(); } }
function guardarConsSel() { try { localStorage.setItem("pd_cons_sel", JSON.stringify([...S.consSel])); } catch {} }

function creditosConsolidados() {
  const sel = S.consSel || new Set();
  if (!sel.size) return [];
  let lista = Calc.montar(S.docs.filter(d => sel.has(d.cnpj)), S.params, S.ajustes, S.selic, S.dataPos);
  if (S.consSoSaldo) lista = lista.filter(c => c.saldo_original > 0.005);
  return lista;
}

// agrupa por empresa, na ordem alfabética, com subtotais
function gruposConsolidado(lista) {
  const mapa = new Map();
  for (const c of lista) {
    if (!mapa.has(c.cnpj)) mapa.set(c.cnpj, {cnpj: c.cnpj, nome: c.nome_empresa || "", creditos: []});
    mapa.get(c.cnpj).creditos.push(c);
  }
  const soma = (cs, f) => r2(cs.reduce((s, c) => s + (c[f] || 0), 0));
  return [...mapa.values()].sort((a, b) => a.nome.localeCompare(b.nome)).map(g => ({...g,
    valor: soma(g.creditos, "valor_original"), utilizado: soma(g.creditos, "total_utilizado"),
    compensado: soma(g.creditos, "total_compensado"),
    saldo: soma(g.creditos, "saldo_original"), atualizado: soma(g.creditos, "saldo_atualizado")}));
}

async function exportarConsolidado(lista) {
  carregando(true);
  try {
    const grupos = gruposConsolidado(lista);
    const wb = new ExcelJS.Workbook();
    const MOEDA = '#,##0.00;[Red]-#,##0.00', PCT = '0.00"%"', DATA = "dd/mm/yyyy";
    const AZUL = "FF61729F", AZUL_CLARO = "FFE8EBF3", LARANJA = "FFF58547";
    const toDate = iso => iso ? new Date(String(iso).slice(0, 10) + "T12:00:00") : null;
    const cab = (ws, r, tit) => { const row = ws.getRow(r); tit.forEach((t, i) => { const c = row.getCell(i + 1); c.value = t;
      c.font = {bold: true, color: {argb: "FFFFFFFF"}}; c.fill = {type: "pattern", pattern: "solid", fgColor: {argb: AZUL}};
      c.alignment = {wrapText: true, vertical: "middle", horizontal: "center"}; }); row.height = 30; };
    const lin = (ws, r, vals, fmts) => { const row = ws.getRow(r); vals.forEach((v, i) => { const c = row.getCell(i + 1); c.value = v ?? null;
      if (fmts[i]) c.numFmt = fmts[i]; c.border = {bottom: {style: "thin", color: {argb: "FFD9DCE3"}}}; }); };
    const botao = (cell, texto, destino) => {
      cell.value = {text: texto, hyperlink: `#'${destino}'!A1`};
      cell.font = {bold: true, color: {argb: "FFFFFFFF"}, underline: false};
      cell.fill = {type: "pattern", pattern: "solid", fgColor: {argb: LARANJA}};
      cell.alignment = {horizontal: "center", vertical: "middle"};
      cell.border = {top: {style: "thin", color: {argb: LARANJA}}, bottom: {style: "thin", color: {argb: LARANJA}},
                     left: {style: "thin", color: {argb: LARANJA}}, right: {style: "thin", color: {argb: LARANJA}}};
    };

    // nomes das abas por empresa (máx. 31 caracteres, sem caracteres proibidos, sem repetir)
    const usados = new Set(["Resumo"]);
    for (const g of grupos) {
      const base = (g.nome || g.cnpj).replace(/[\\\/*?:\[\]']/g, " ").replace(/\s+/g, " ").trim().slice(0, 24) + " " + soDigitos(g.cnpj).slice(8, 12);
      let nome = base.slice(0, 31), i = 2;
      while (usados.has(nome)) nome = `${base.slice(0, 27)}(${i++})`;
      usados.add(nome); g.aba = nome;
    }

    // ---- Resumo: empresa por empresa, uma embaixo da outra ----
    const res = wb.addWorksheet("Resumo");
    res.getCell("A1").value = "Extrato consolidado de créditos PER/DCOMP";
    res.getCell("A1").font = {bold: true, size: 14, color: {argb: AZUL}};
    res.getCell("A2").value = `Posição em ${dt(S.dataPos)} · ${grupos.length} empresa(s)${S.consSoSaldo ? " · somente créditos com saldo" : ""}`;
    const COLS = ["Tipo de crédito","Cód. receita","Período / PA","PER/DCOMP de origem","Status","Início Selic",
                  "Valor original","Crédito original utilizado","Débitos compensados","Saldo original","Selic acumulada","Saldo atualizado"];
    const FMT = [, , , , , , MOEDA, MOEDA, MOEDA, MOEDA, PCT, MOEDA];
    let r = 4;
    const subtotais = [];
    for (const g of grupos) {
      const t = res.getRow(r);
      res.mergeCells(r, 1, r, 10);
      t.getCell(1).value = `${g.nome}  ·  CNPJ ${g.cnpj}  ·  ${g.creditos.length} crédito(s)`;
      t.getCell(1).font = {bold: true, size: 12, color: {argb: "FF1F2430"}};
      t.getCell(1).fill = {type: "pattern", pattern: "solid", fgColor: {argb: AZUL_CLARO}};
      res.mergeCells(r, 11, r, 12);
      botao(t.getCell(11), "Ver composição ›", g.aba);
      t.height = 22;
      r++;
      cab(res, r, COLS); r++;
      const ini = r;
      for (const c of g.creditos) lin(res, r++, [c.tipo_credito, codigoTxt(c), periodoTxt(c), c.numero, c.status, mesAno(c.selic_inicio),
        c.valor_original, c.total_utilizado, c.total_compensado, c.saldo_original, c.selic_hoje, c.saldo_atualizado], FMT);
      const sub = res.getRow(r);
      sub.getCell(1).value = `Subtotal ${g.nome}`;
      for (const col of ["G", "H", "I", "J", "L"]) { const c = res.getCell(`${col}${r}`); c.value = {formula: `SUM(${col}${ini}:${col}${r - 1})`}; c.numFmt = MOEDA; }
      sub.font = {bold: true};
      sub.eachCell(c => c.border = {top: {style: "thin", color: {argb: AZUL}}});
      subtotais.push(r);
      r += 2;
    }
    const tt = res.getRow(r);
    tt.getCell(1).value = `Total consolidado (${grupos.length} empresa(s))`;
    for (const col of ["G", "H", "I", "J", "L"]) {
      const c = res.getCell(`${col}${r}`); c.value = {formula: subtotais.map(s => `${col}${s}`).join("+")}; c.numFmt = MOEDA;
    }
    tt.font = {bold: true, size: 12, color: {argb: "FFFFFFFF"}};
    tt.eachCell(c => c.fill = {type: "pattern", pattern: "solid", fgColor: {argb: AZUL}});
    for (let col = 1; col <= 12; col++) { const c = tt.getCell(col); if (!c.fill) c.fill = {type: "pattern", pattern: "solid", fgColor: {argb: AZUL}}; }
    [30, 12, 22, 34, 14, 11, 16, 16, 16, 16, 11, 16].forEach((w, i) => res.getColumn(i + 1).width = w);
    res.views = [{state: "frozen", ySplit: 2}];

    // ---- Uma aba por empresa com a composição ----
    const docPorId = Object.fromEntries(S.docs.map(d => [d.id, d]));
    const todosIds = lista.flatMap(c => c.movimentos.filter(m => m.documento_id).map(m => m.documento_id));
    const debs = await debitosDe(todosIds);
    for (const g of grupos) {
      const ws = wb.addWorksheet(g.aba);
      botao(ws.getCell("A1"), "‹ Voltar ao resumo", "Resumo");
      ws.getCell("B1").value = g.nome; ws.getCell("B1").font = {bold: true, size: 14, color: {argb: AZUL}};
      ws.getCell("B2").value = `CNPJ ${g.cnpj} · posição em ${dt(S.dataPos)}`;
      let r = 4;
      ws.getCell(r, 1).value = "Créditos da empresa"; ws.getCell(r, 1).font = {bold: true, size: 12}; r++;
      cab(ws, r, COLS); r++;
      const ini = r;
      for (const c of g.creditos) lin(ws, r++, [c.tipo_credito, codigoTxt(c), periodoTxt(c), c.numero, c.status, mesAno(c.selic_inicio),
        c.valor_original, c.total_utilizado, c.total_compensado, c.saldo_original, c.selic_hoje, c.saldo_atualizado], FMT);
      ws.getCell(r, 1).value = "Total"; ws.getRow(r).font = {bold: true};
      for (const col of ["G", "H", "I", "J", "L"]) { const c = ws.getCell(`${col}${r}`); c.value = {formula: `SUM(${col}${ini}:${col}${r - 1})`}; c.numFmt = MOEDA; }
      r += 2;

      for (const c of g.creditos) {
        const t = ws.getRow(r);
        ws.mergeCells(r, 1, r, 11);
        t.getCell(1).value = `${c.tipo_credito}${codigoTxt(c) ? " · cód. " + codigoTxt(c) : ""} · ${periodoTxt(c) || "sem período"} · ${c.numero}`;
        t.getCell(1).font = {bold: true, size: 12, color: {argb: "FF1F2430"}};
        t.getCell(1).fill = {type: "pattern", pattern: "solid", fgColor: {argb: AZUL_CLARO}};
        r++;
        if (origemInfo(c)) { ws.getCell(r, 1).value = "Origem do crédito: " + origemInfo(c).detalhe; r++; }
        if (c.avisos.length) { ws.getCell(r, 1).value = "Avisos: " + c.avisos.join(" | "); ws.getCell(r, 1).font = {color: {argb: "FFA4501C"}}; r++; }
        ws.getCell(r, 1).value = "Conta-corrente"; ws.getCell(r, 1).font = {bold: true}; r++;
        cab(ws, r, ["Data","Tipo","PER/DCOMP","Status","Saldo original antes","Selic acumulada","Total dos débitos",
                    "Crédito original utilizado","Selic utilizada","Saldo original após","Saldo atualizado após","Divergências"]);
        if (!c.movimentos.length) { r++; ws.getCell(r, 1).value = "Nenhuma DCOMP vinculada."; }
        for (const m of c.movimentos) lin(ws, ++r, [toDate(m.data), m.tipo, m.numero, m.status, m.saldo_antes, m.selic, m.total_debitos,
          m.utilizado, m.juros, m.saldo_depois, m.saldo_atualizado_depois, m.divergencias.join(" | ")],
          [DATA, , , , MOEDA, PCT, MOEDA, MOEDA, MOEDA, MOEDA, MOEDA]);
        r += 2;
        const ids = new Set(c.movimentos.filter(m => m.documento_id).map(m => m.documento_id));
        const dd = debs.filter(d => ids.has(d.documento_id)).sort((a, b) =>
          (docPorId[a.documento_id]?.data_transmissao || "").localeCompare(docPorId[b.documento_id]?.data_transmissao || "") || a.documento_id - b.documento_id || a.seq - b.seq);
        if (dd.length) {
          ws.getCell(r, 1).value = "Débitos compensados"; ws.getCell(r, 1).font = {bold: true}; r++;
          cab(ws, r, ["Data DCOMP","PER/DCOMP","Grupo","Código","Denominação","Período de apuração","Vencimento","Principal","Multa","Juros","Total"]);
          for (const d of dd) { const doc = docPorId[d.documento_id] || {};
            lin(ws, ++r, [toDate(doc.data_transmissao), doc.numero, d.grupo, d.codigo_receita, d.denominacao, d.periodo_apuracao,
              toDate(d.vencimento), num(d.principal), num(d.multa), num(d.juros), num(d.total)], [DATA, , , , , , DATA, MOEDA, MOEDA, MOEDA, MOEDA]); }
          r += 2;
        }
        const apr = Calc.apropriar(c, S.dataPos, S.selic);
        if (apr.length) {
          ws.getCell(r, 1).value = "Selic a apropriar por competência"; ws.getCell(r, 1).font = {bold: true}; r++;
          cab(ws, r, ["Competência","Saldo original no início do mês","Taxa","Selic do mês"]);
          const ia = r + 1;
          for (const a of apr) lin(ws, ++r, [a.competencia, a.saldo, a.taxa, a.selic], [, MOEDA, PCT, MOEDA]);
          r++; ws.getCell(r, 1).value = "Total"; ws.getCell(r, 1).font = {bold: true};
          ws.getCell(r, 4).value = {formula: `SUM(D${ia}:D${r - 1})`}; ws.getCell(r, 4).numFmt = MOEDA; ws.getCell(r, 4).font = {bold: true};
          r += 2;
        }
        r++;
      }
      [24, 34, 34, 34, 40, 16, 16, 16, 16, 16, 16, 50].forEach((w, i) => ws.getColumn(i + 1).width = w);
    }

    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([buf], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    a.download = `Extrato consolidado PERDCOMP ${S.dataPos}.xlsx`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { alert("Erro ao gerar o Excel: " + e.message); }
  finally { carregando(false); }
}

// ---------------- Ações e exportação ----------------
async function acao(fn, msgOk) {
  carregando(true);
  try { await fn(); await carregarDados(); render(); toast(msgOk); }
  catch (e) { alert("Erro: " + (e.message || e)); }
  finally { carregando(false); }
}

function toast(msg) {
  if (!msg) return;
  const d = document.createElement("div");
  d.className = "msg ok";
  d.style.cssText = "position:fixed;right:20px;bottom:20px;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)";
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}

async function exportarExcel(lista) {
  carregando(true);
  try {
    const wb = new ExcelJS.Workbook();
    const MOEDA = '#,##0.00;[Red]-#,##0.00', PCT = '0.00"%"', DATA = "dd/mm/yyyy";
    const toDate = iso => iso ? new Date(iso.slice(0, 10) + "T12:00:00") : null;
    const cab = (ws, r, tit) => { const row = ws.getRow(r); tit.forEach((t, i) => { const c = row.getCell(i + 1); c.value = t;
      c.font = {bold: true, color: {argb: "FFFFFFFF"}}; c.fill = {type: "pattern", pattern: "solid", fgColor: {argb: "FF61729F"}};
      c.alignment = {wrapText: true, vertical: "middle", horizontal: "center"}; }); row.height = 30; };
    const lin = (ws, r, vals, fmts) => { const row = ws.getRow(r); vals.forEach((v, i) => { const c = row.getCell(i + 1); c.value = v ?? null;
      if (fmts[i]) c.numFmt = fmts[i]; c.border = {bottom: {style: "thin", color: {argb: "FFD9DCE3"}}}; }); };
    const larg = (ws, ws_) => ws_.forEach((w, i) => ws.getColumn(i + 1).width = w);

    const res = wb.addWorksheet("Resumo");
    res.getCell("A1").value = "Controle de créditos PER/DCOMP"; res.getCell("A1").font = {bold: true, size: 14, color: {argb: "FF61729F"}};
    res.getCell("A2").value = `Posição em ${dt(S.dataPos)}`;
    cab(res, 4, ["Empresa","CNPJ","Tipo de crédito","Período","PER/DCOMP de origem","Status","Início Selic","Valor original",
                 "Crédito original utilizado","Débitos compensados","Saldo original","Selic acumulada","Saldo atualizado","Avisos"]);
    let r = 5;
    for (const c of lista) lin(res, r++, [c.nome_empresa, c.cnpj,
      c.tipo_credito + (codigoTxt(c) ? ` (cód. ${codigoTxt(c)})` : ""), periodoTxt(c), c.numero, c.status, mesAno(c.selic_inicio),
      c.valor_original, c.total_utilizado, c.total_compensado, c.saldo_original, c.selic_hoje, c.saldo_atualizado, c.avisos.join(" | ")],
      [, , , , , , , MOEDA, MOEDA, MOEDA, MOEDA, PCT, MOEDA]);
    res.getCell(`A${r}`).value = "Total"; res.getCell(`A${r}`).font = {bold: true};
    for (const col of ["H","I","J","K","M"]) { const c = res.getCell(`${col}${r}`); c.value = {formula: `SUM(${col}5:${col}${r - 1})`}; c.numFmt = MOEDA; c.font = {bold: true}; }
    larg(res, [32,20,26,24,34,14,11,16,16,16,16,10,16,60]);
    res.views = [{state: "frozen", ySplit: 4}];

    const usados = new Set(["Resumo"]);
    const docPorId = Object.fromEntries(S.docs.map(d => [d.id, d]));
    for (const c of lista) {
      const ab = /saldo negativo/i.test(c.tipo_credito) ? "SN" + c.tipo_credito.split(" ").pop().toUpperCase()
        : (c.tipo_credito.match(/\b\w{3,}/g) || ["CRED"]).map(p => p[0]).join("").toUpperCase().slice(0, 8);
      let nome = `${ab} ${c.numero.slice(-9)}`.replace(/[\\\/*?:\[\]]/g, "-").slice(0, 31), i = 2;
      const base = nome; while (usados.has(nome)) nome = `${base.slice(0, 28)}(${i++})`; usados.add(nome);
      const ws = wb.addWorksheet(nome);
      const info = [["Empresa", c.nome_empresa], ["CNPJ", c.cnpj], ["Tipo de crédito", c.tipo_credito], ["Período", periodoTxt(c)],
        ...(origemInfo(c) ? [["Código da receita (origem)", codigoTxt(c)], ["Origem do crédito", origemInfo(c).detalhe]] : []),
        ["PER/DCOMP de origem", c.numero], ["Status", c.status], ["Início da Selic", mesAno(c.selic_inicio)],
        ["Valor original do crédito", c.valor_original, MOEDA], ["Saldo original", c.saldo_original, MOEDA],
        [`Selic acumulada em ${dt(S.dataPos)}`, c.selic_hoje, PCT], ["Saldo atualizado", c.saldo_atualizado, MOEDA], ["Observação", c.observacao]];
      info.forEach(([k, v, f], i) => { ws.getCell(i + 1, 1).value = k; ws.getCell(i + 1, 1).font = {bold: true};
        ws.getCell(i + 1, 2).value = v ?? null; if (f) ws.getCell(i + 1, 2).numFmt = f; });
      r = info.length + 2;
      ws.getCell(r, 1).value = "Conta-corrente do crédito"; ws.getCell(r, 1).font = {bold: true, size: 12}; r++;
      cab(ws, r, ["Data","Tipo","PER/DCOMP","Status","Saldo original antes","Selic acumulada","Total dos débitos",
                  "Crédito original utilizado","Selic utilizada","Saldo original após","Saldo atualizado após","Divergências"]);
      for (const m of c.movimentos) lin(ws, ++r, [toDate(m.data), m.tipo, m.numero, m.status, m.saldo_antes, m.selic, m.total_debitos,
        m.utilizado, m.juros, m.saldo_depois, m.saldo_atualizado_depois, m.divergencias.join(" | ")],
        [DATA, , , , MOEDA, PCT, MOEDA, MOEDA, MOEDA, MOEDA, MOEDA]);
      const ids = c.movimentos.filter(m => m.documento_id).map(m => m.documento_id);
      const debs = await debitosDe(ids);
      if (debs.length) {
        r += 3; ws.getCell(r, 1).value = "Débitos compensados"; ws.getCell(r, 1).font = {bold: true, size: 12}; r++;
        cab(ws, r, ["Data DCOMP","PER/DCOMP","Grupo","Código","Denominação","Período de apuração","Vencimento","Principal","Multa","Juros","Total"]);
        debs.sort((a, b) => (docPorId[a.documento_id].data_transmissao || "").localeCompare(docPorId[b.documento_id].data_transmissao || "") || a.documento_id - b.documento_id || a.seq - b.seq);
        for (const d of debs) { const doc = docPorId[d.documento_id];
          lin(ws, ++r, [toDate(doc.data_transmissao), doc.numero, d.grupo, d.codigo_receita, d.denominacao, d.periodo_apuracao,
            toDate(d.vencimento), num(d.principal), num(d.multa), num(d.juros), num(d.total)], [DATA, , , , , , DATA, MOEDA, MOEDA, MOEDA, MOEDA]); }
      }
      const apr = Calc.apropriar(c, S.dataPos, S.selic);
      if (apr.length) {
        r += 3; ws.getCell(r, 1).value = "Selic a apropriar por competência"; ws.getCell(r, 1).font = {bold: true, size: 12}; r++;
        cab(ws, r, ["Competência","Saldo original no início do mês","Taxa","Selic do mês"]);
        const ini = r + 1;
        for (const a of apr) lin(ws, ++r, [a.competencia, a.saldo, a.taxa, a.selic], [, MOEDA, PCT, MOEDA]);
        r++; ws.getCell(r, 1).value = "Total"; ws.getCell(r, 1).font = {bold: true};
        ws.getCell(r, 4).value = {formula: `SUM(D${ini}:D${r - 1})`}; ws.getCell(r, 4).numFmt = MOEDA; ws.getCell(r, 4).font = {bold: true};
      }
      larg(ws, [26,34,34,14,40,16,16,16,16,16,16,60]);
    }
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([buf], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    a.download = lista.length === 1 ? `Credito ${lista[0].numero} ${S.dataPos}.xlsx` : `Controle PERDCOMP ${S.dataPos}.xlsx`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { alert("Erro ao gerar o Excel: " + e.message); }
  finally { carregando(false); }
}

// INICIALIZAÇÃO

async function entrar(user) {
  if (!/@irko\.com\.br$/i.test(user.email || "")) {
    await sb.auth.signOut();
    return telaLogin("Acesso restrito a e-mails @irko.com.br.");
  }
  S.user = user;
  // primeiro acesso: a senha inicial definida pelo administrador precisa ser trocada
  if (!user.user_metadata?.senha_definida) { S.trocaObrigatoria = true; return render(); }
  S.trocaObrigatoria = false;
  carregando(true);
  try { await carregarDados(); await atualizarSelicSeNecessario(); }
  catch (e) { S.aviso = "Erro ao carregar dados: " + e.message; }
  carregando(false);
  render();
}

async function iniciar() {
  const c = cfg();
  if (!c.url || !c.key) return render();
  // link de recuperação de senha enviado por e-mail (#access_token=...&type=recovery) ou link inválido (#error=...)
  const retorno = new URLSearchParams(location.hash.slice(1));
  const viaRecuperacao = retorno.get("type") === "recovery";
  const erroLink = retorno.get("error_code") || retorno.get("error");
  sb = supabase.createClient(c.url, c.key);
  sb.auth.onAuthStateChange((evento, sessao) => {
    if (evento === "PASSWORD_RECOVERY" && sessao) { S.recuperacao = true; S.user = sessao.user; render(); }
  });
  const {data} = await sb.auth.getSession();
  if (location.hash.includes("=")) history.replaceState(null, "", location.pathname + "#painel");
  if (erroLink && !data.session) return telaLogin(/expired/i.test(erroLink)
    ? "O link de recuperação expirou ou já foi usado. Peça um novo em Esqueci minha senha."
    : "Link inválido. Peça um novo em Esqueci minha senha.");
  if (data.session && viaRecuperacao) { S.recuperacao = true; S.user = data.session.user; return render(); }
  if (data.session) await entrar(data.session.user); else render();
}

window.addEventListener("hashchange", () => {
  if (location.hash.includes("=")) return;   // retorno de autenticação, tratado em iniciar()
  S.view = location.hash.slice(1) || "painel"; if (S.user) render();
});
S.view = location.hash.includes("=") ? "painel" : (location.hash.slice(1) || "painel");
iniciar();
</script>
